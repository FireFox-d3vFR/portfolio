<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <title>AZOR — repères graphiques</title>
  <desc>Synthèse de l’interface AZOR et du langage visuel Boosted d’Orange : orange, noir, blanc, Helvetica Neue, tableaux, filtres et états explicites. Aucun équipement ni donnée interne représentés.</desc>
  <rect width="1440" height="900" fill="#fff"/>
  <rect width="22" height="900" fill="#ff7900"/>
  <g font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" fill="#000">
    <text x="80" y="78" font-size="16" font-weight="700" letter-spacing="3">AZOR / APPLICATION MÉTIER ORANGE</text>
    <text x="80" y="175" font-size="86" font-weight="700" letter-spacing="-3">AZ<tspan fill="#ff7900">OR</tspan></text>
    <text x="80" y="222" font-size="26" font-weight="700">Des données métier à l’action, une interface structurée.</text>
    <text x="80" y="258" font-size="18" fill="#666">Repères issus des captures et du langage visuel Boosted d’Orange.</text>
    <g transform="translate(80 310)">
      <rect width="232" height="110" fill="#ff7900"/>
      <text y="142" font-size="18" font-weight="700">Accent / #FF7900</text>
      <rect x="262" width="232" height="110" fill="#000"/>
      <text x="262" y="142" font-size="18" font-weight="700">Noir / #000000</text>
      <rect x="524" width="232" height="110" fill="#fff" stroke="#ccc"/>
      <text x="524" y="142" font-size="18" font-weight="700">Blanc / #FFFFFF</text>
      <rect x="786" width="232" height="110" fill="#eee"/>
      <text x="786" y="142" font-size="18" font-weight="700">Surface / #EEEEEE</text>
      <rect x="1048" width="232" height="110" fill="#666"/>
      <text x="1048" y="142" font-size="18" font-weight="700">Texte / #666666</text>
    </g>
    <path d="M80 510h1280" stroke="#ccc"/>
    <text x="80" y="558" font-size="15" font-weight="700" letter-spacing="2" fill="#666">TYPOGRAPHIE</text>
    <text x="80" y="610" font-size="38" font-weight="700">Helvetica Neue</text>
    <text x="80" y="650" font-size="20">Titres affirmés, libellés courts et hiérarchie nette.</text>
    <text x="80" y="684" font-size="18" fill="#666">Helvetica / Arial en repli selon le système.</text>
    <text x="80" y="744" font-size="15" font-weight="700" letter-spacing="2" fill="#666">STRUCTURE</text>
    <text x="80" y="780" font-size="20">Navigation sombre · filtres · tableaux · actions explicites</text>
    <text x="810" y="558" font-size="15" font-weight="700" letter-spacing="2" fill="#666">COMPOSANTS</text>
    <rect x="810" y="582" width="232" height="54" fill="#ff7900"/>
    <text x="834" y="616" font-size="19" font-weight="700">Valider le DRY-RUN</text>
    <rect x="1062" y="582" width="246" height="54" fill="#fff" stroke="#000" stroke-width="2"/>
    <text x="1090" y="616" font-size="19" font-weight="700">Voir le journal</text>
    <rect x="810" y="669" width="190" height="43" fill="#198b19"/>
    <text x="828" y="697" font-size="17" font-weight="700" fill="#fff">✓ Succès</text>
    <rect x="1020" y="669" width="288" height="43" fill="#000"/>
    <text x="1040" y="697" font-size="17" font-weight="700" fill="#fff">○ Jamais exécuté</text>
    <text x="810" y="759" font-size="18" fill="#666">Couleurs accompagnées de libellés lisibles.</text>
    <text x="80" y="855" font-size="15" fill="#666">Planche de présentation réalisée pour mon portfolio, à partir de l’interface existante.</text>
  </g>
</svg>
